<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTS / Sitios · NettOps Perú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/tokens.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="../js/components.js"></script>
<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script defer src="../js/layout.js"></script>
<script>
const TIPOS_SITIO = ['Greenfield', 'Rooftop', 'Monoposte', 'Torre autosoportada', 'Camuflado (palmera)', 'Camuflado (chimenea)'];
const TECNOLOGIAS = ['2G', '3G', '4G', '5G'];

function btsPage() {
  const vacio = () => ({
    id: null, codigo: '', nombre: '', direccion: '', distrito: '', provincia: 'Ica',
    lat: '', lng: '', tipo: 'Greenfield', altura: 30, tecnologias: ['4G'],
    energia: 'Red comercial', proyectoId: '', estado: 'planificado',
  });
  return {
    map: null,
    capa: null,
    capaRuta: null,
    vista: 'lista',            // lista | mapa
    fEstadoM: '', fProyectoM: '', rutaTec: '',
    form: null,                // sitio en edición (null = modal cerrado)
    guardando: false, tocado: false,
    borrando: null,
    TIPOS_SITIO, TECNOLOGIAS,

    init() {
      this.$nextTick(() => { this.montarMapa(); });
      window.addEventListener('app:data', () => this.pintarMarcadores());
      this.$watch('fEstadoM', () => this.pintarMarcadores());
      this.$watch('fProyectoM', () => this.pintarMarcadores());
      this.$watch('rutaTec', () => this.pintarRuta());
    },

    /* ── Alta y edición de sitios ── */
    nuevoSitio() {
      this.form = vacio();
      this.form.proyectoId = Alpine.store('db').proyectos[0]?.id || '';
      this.tocado = false;
    },
    editarSitio(s) { this.form = { ...s, tecnologias: [...(s.tecnologias || [])] }; this.tocado = false; },
    get errCodigo() {
      if (!this.tocado) return '';
      const c = (this.form.codigo || '').trim().toUpperCase();
      if (!c) return 'El código del sitio es obligatorio';
      if (!/^[A-Z]{2}-[A-Z0-9]+-[0-9]{3,4}$/.test(c)) return 'Formato de operador: REGIÓN-DISTRITO-NNNN (ej. IC-PISCO-0342)';
      const dup = Alpine.store('db').sitios.find(s => s.codigo === c && s.id !== this.form.id);
      return dup ? 'Ya existe un sitio con ese código' : '';
    },
    get errNombre() {
      if (!this.tocado) return '';
      return (this.form.nombre || '').trim().length < 3 ? 'El nombre del sitio es obligatorio' : '';
    },
    get errCoords() {
      if (!this.tocado) return '';
      const la = Number(this.form.lat), ln = Number(this.form.lng);
      if (!this.form.lat || !this.form.lng || isNaN(la) || isNaN(ln)) return 'Indica latitud y longitud';
      if (la < -19 || la > 0 || ln < -82 || ln > -68) return 'Esas coordenadas no caen en Perú (lat −19 a 0, lng −82 a −68)';
      return '';
    },
    // Pegar "-13.71030, -76.20320" desde Google Maps rellena ambos campos
    pegarCoords(ev) {
      const txt = (ev.clipboardData || window.clipboardData).getData('text') || '';
      const m = txt.match(/(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/);
      if (m) { ev.preventDefault(); this.form.lat = m[1]; this.form.lng = m[2]; this.tocado = true; }
    },
    async guardarSitio() {
      this.tocado = true;
      if (this.errCodigo || this.errNombre || this.errCoords) return;
      this.guardando = true;
      const r = await ACCIONES.guardarSitio({ ...this.form, codigo: this.form.codigo.trim().toUpperCase() });
      this.guardando = false;
      if (!r.ok) { Alpine.store('toasts').push('error', 'No se pudo guardar', r.error); return; }
      Alpine.store('toasts').push('ok', r.creado ? 'Sitio registrado' : 'Ficha actualizada',
        this.form.codigo.toUpperCase());
      this.form = null;
      this.pintarMarcadores();
    },
    async confirmarBorrado() {
      const s = this.borrando;
      const r = await ACCIONES.eliminarSitio(s.id);
      if (!r.ok) { Alpine.store('toasts').push('error', 'No se puede eliminar', r.error); this.borrando = null; return; }
      Alpine.store('toasts').push('ok', 'Sitio eliminado', s.codigo);
      this.borrando = null;
      this.pintarMarcadores();
    },
    setVista(v) {
      this.vista = v;
      this.$nextTick(() => {
        this.map && this.map.invalidateSize();
        if (v === 'mapa') this.pintarMarcadores();
        // Segundo ajuste tras el reflow del contenedor
        setTimeout(() => this.map && this.map.invalidateSize(), 320);
      });
    },
    sitiosFiltrados() {
      return Alpine.store('db').sitios
        .filter(s => !this.fEstadoM || s.estado === this.fEstadoM)
        .filter(s => !this.fProyectoM || s.proyectoId === this.fProyectoM);
    },
    montarMapa() {
      if (!this.$refs.mapa || this.map) return;
      this.map = L.map(this.$refs.mapa, { scrollWheelZoom: false }).setView([-14.3, -75.6], 8);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
      }).addTo(this.map);
      // Clúster si el plugin cargó; grupo simple como respaldo
      this.capa = (L.markerClusterGroup ? L.markerClusterGroup({ maxClusterRadius: 44, showCoverageOnHover: false }) : L.layerGroup()).addTo(this.map);
      this.capaRuta = L.layerGroup().addTo(this.map);
      this.pintarMarcadores();
    },
    pintarMarcadores() {
      if (!this.capa) return;
      this.capa.clearLayers();
      const colores = { operativo: 'completado', en_ejecucion: 'ejecucion', planificado: 'pendiente', alarma: 'critico' };
      this.sitiosFiltrados().forEach(s => {
        const k = colores[s.estado] || 'cancelado';
        const icon = L.divIcon({
          className: '',
          html: `<div class="bts-pin" style="background:var(--st-${k})">${s.tecnologias.includes('5G') ? '5G' : s.tecnologias.includes('4G') ? '4G' : '3G'}</div>`,
          iconSize: [26, 26], iconAnchor: [13, 13],
        });
        L.marker([s.lat, s.lng], { icon, keyboard: false })
          .bindPopup(`<div style="min-width:190px">
             <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink3)">${UI.esc(s.codigo)}</p>
             <p style="font-weight:600;font-size:13px;margin:2px 0">${UI.esc(s.nombre)}</p>
             <p style="font-size:11px;color:var(--ink2)">${UI.esc(s.distrito)} · ${UI.esc(s.tipo)} · ${UI.esc(UI.estadoInfo(s.estado).label)}</p>
             <a href="bts-detalle.html?id=${encodeURIComponent(s.id)}&role=${encodeURIComponent(Alpine.store('ui').role)}&theme=${encodeURIComponent(Alpine.store('ui').theme)}"
               style="font-size:12px;color:#2563eb;font-weight:500">Ver ficha →</a></div>`)
          .addTo(this.capa);
      });
    },
    // Ruta del día de un técnico: sitios de sus actividades de hoy en orden horario
    pintarRuta() {
      if (!this.capaRuta) return;
      this.capaRuta.clearLayers();
      if (!this.rutaTec) return;
      const acts = CALC.actividadesDeTecnico(this.rutaTec, window.HOY)
        .filter(a => a.estado !== 'cancelada')
        .sort((x, y) => x.hIni.localeCompare(y.hIni));
      const puntos = acts.map(a => CALC.sitio(a.sitioId)).filter(s => s.lat);
      if (!puntos.length) {
        Alpine.store('toasts').push('info', 'Sin ruta para hoy', `${CALC.tecnico(this.rutaTec).nombre} no tiene actividades hoy.`);
        return;
      }
      const coords = puntos.map(s => [s.lat, s.lng]);
      L.polyline(coords, { color: '#2563eb', weight: 3, dashArray: '6 6', opacity: .85 }).addTo(this.capaRuta);
      puntos.forEach((s, i) => {
        L.marker([s.lat, s.lng], {
          icon: L.divIcon({
            className: '',
            html: `<div class="bts-pin" style="background:#2563eb;width:22px;height:22px;border-radius:999px">${i + 1}</div>`,
            iconSize: [22, 22], iconAnchor: [11, 11],
          }),
          keyboard: false, interactive: false, zIndexOffset: 1000,
        }).addTo(this.capaRuta);
      });
      this.map.fitBounds(L.latLngBounds(coords).pad(0.4));
    },
  };
}
</script>
</head>
<body data-page="bts" data-title="BTS / Sitios" class="bg-surface-0">

<main id="page" x-data="btsPage()">

  <template x-if="$store.ui.view==='loading'">
    <div class="space-y-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3" x-html="UI.skel.kpis(4)"></div>
      <div class="ui-card p-0"><div class="ui-skel" style="height:320px;border-radius:8px"></div></div>
      <div x-html="UI.skel.table(8,6)"></div>
    </div>
  </template>
  <template x-if="$store.ui.view==='empty'">
    <div class="ui-card mt-8" x-html="UI.emptyState({ icon:'tower', title:'No hay sitios registrados', desc:'Importa o registra las estaciones base para verlas en el mapa y en el listado.', action: UI.btn({label:'Registrar sitio', icon:'plus'}) })"></div>
  </template>
  <template x-if="$store.ui.view==='error'">
    <div class="ui-card mt-8" x-html="UI.errorState({ desc:'El servicio de georreferenciación no respondió. El listado puede mostrarse sin mapa.', retryAttr:`@click=&quot;$store.ui.setView('data')&quot;` })"></div>
  </template>

  <div x-show="$store.ui.view==='data'" class="space-y-4">

    <div class="flex flex-wrap items-center gap-2">
      <div class="seg" role="group" aria-label="Vista de sitios" style="display:flex">
        <button :class="vista==='lista' && 'is-on'" @click="setVista('lista')" :aria-pressed="vista==='lista'">Lista + mapa</button>
        <button :class="vista==='mapa' && 'is-on'" @click="setVista('mapa')" :aria-pressed="vista==='mapa'">Mapa completo</button>
      </div>
      <template x-if="vista==='mapa'">
        <div class="flex flex-wrap items-center gap-2">
          <select class="ui-select" style="width:150px" x-model="fEstadoM" aria-label="Filtrar mapa por estado">
            <option value="">Todos los estados</option><option value="operativo">Operativo</option>
            <option value="en_ejecucion">En ejecución</option><option value="planificado">Planificado</option><option value="alarma">En alarma</option>
          </select>
          <select class="ui-select" style="width:165px" x-model="fProyectoM" aria-label="Filtrar mapa por proyecto">
            <option value="">Todos los proyectos</option>
            <template x-for="p in $store.db.proyectos"><option :value="p.id" x-text="p.codigo"></option></template>
          </select>
          <select class="ui-select" style="width:195px" x-model="rutaTec" aria-label="Ruta del día de un técnico">
            <option value="">Ruta del día: elegir técnico…</option>
            <template x-for="t in $store.db.tecnicos.filter(t=>t.estado!=='inactivo')" :key="t.id"><option :value="t.id" x-text="t.nombre"></option></template>
          </select>
          <span class="text-xs text-ink-3 mono" x-text="sitiosFiltrados().length + ' sitios en el mapa'"></span>
        </div>
      </template>
    </div>

    <section class="grid grid-cols-2 md:grid-cols-4 gap-3" x-show="vista==='lista'" aria-label="Resumen de sitios">
      <div class="ui-card ui-kpi"><span class="kpi-label" x-html="UI.icon('tower',13)+'Sitios totales'"></span><span class="kpi-value" x-countup="$store.db.sitios.length">0</span></div>
      <div class="ui-card ui-kpi"><span class="kpi-label" x-html="UI.icon('checkCircle',13)+'Operativos'"></span><span class="kpi-value" style="color:var(--st-completado)" x-countup="$store.db.sitios.filter(s=>s.estado==='operativo').length">0</span></div>
      <div class="ui-card ui-kpi"><span class="kpi-label" x-html="UI.icon('zap',13)+'Con trabajos'"></span><span class="kpi-value" style="color:var(--st-ejecucion)" x-countup="$store.db.sitios.filter(s=>s.estado==='en_ejecucion').length">0</span></div>
      <div class="ui-card ui-kpi"><span class="kpi-label" x-html="UI.icon('alert',13)+'En alarma'"></span><span class="kpi-value" style="color:var(--st-critico)" x-countup="$store.db.sitios.filter(s=>s.estado==='alarma').length">0</span></div>
    </section>

    <section class="ui-card p-0 overflow-hidden" aria-label="Mapa de sitios">
      <div x-ref="mapa" :style="vista==='mapa' ? 'height:calc(100vh - 280px);min-height:420px' : 'height:340px'"
        role="application" aria-label="Mapa OpenStreetMap con las estaciones base"></div>
      <div class="flex flex-wrap gap-3 px-4 py-2.5 border-t border-line text-xs" aria-hidden="false">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded" style="background:var(--st-completado)"></span>Operativo</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded" style="background:var(--st-ejecucion)"></span>Con trabajos</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded" style="background:var(--st-pendiente)"></span>Planificado</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded" style="background:var(--st-critico)"></span>En alarma</span>
      </div>
    </section>

    <section x-show="vista==='lista'"
      x-data="dataTable({ rows: () => $store.db.sitios.map(s => ({...s, proyecto: CALC.proyecto(s.proyectoId).codigo, avance: CALC.avanceSitio(s.id) ?? -1 })), sortKey: 'codigo', pageSize: 10, filters: { estado: '', proyecto: '' } })"
      aria-label="Listado de sitios">
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <div class="relative">
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-ink-3" x-html="UI.icon('search',14)"></span>
          <input type="search" class="ui-input pl-8" style="width:240px" placeholder="Código, distrito, dirección…" x-model="q" aria-label="Buscar sitio">
        </div>
        <select class="ui-select" style="width:150px" x-model="filters.estado" aria-label="Estado">
          <option value="">Todos los estados</option><option value="operativo">Operativo</option>
          <option value="en_ejecucion">En ejecución</option><option value="planificado">Planificado</option><option value="alarma">En alarma</option>
        </select>
        <select class="ui-select" style="width:170px" x-model="filters.proyecto" aria-label="Proyecto">
          <option value="">Todos los proyectos</option>
          <template x-for="p in $store.db.proyectos"><option :value="p.codigo" x-text="p.codigo"></option></template>
        </select>
        <button class="ui-btn ui-btn-ghost ui-btn-sm" @click="resetFilters()">Limpiar</button>
        <button class="ui-btn ui-btn-primary ui-btn-md ml-auto" x-show="$store.ui.puede('crear')" @click="nuevoSitio()"
          x-html="UI.icon('plus',15)+' Registrar sitio'"></button>
      </div>

      <div class="ui-table-wrap">
        <table class="ui-table" aria-label="Sitios">
          <thead><tr>
            <th class="col-sticky sortable" @click="sortBy('codigo')">Código <span x-text="sortIcon('codigo')"></span></th>
            <th>Nombre</th>
            <th class="sortable" @click="sortBy('distrito')">Distrito <span x-text="sortIcon('distrito')"></span></th>
            <th>Coordenadas</th><th>Tipo</th><th class="sortable" @click="sortBy('proyecto')">Proyecto <span x-text="sortIcon('proyecto')"></span></th>
            <th>Tecnol.</th><th class="sortable" @click="sortBy('estado')">Estado <span x-text="sortIcon('estado')"></span></th>
            <th class="sortable" @click="sortBy('avance')">Avance <span x-text="sortIcon('avance')"></span></th>
            <th><span class="sr-only">Acciones</span></th>
          </tr></thead>
          <tbody>
            <template x-for="s in paged" :key="s.id">
              <tr>
                <td class="col-sticky"><a :href="$store.ui.href('bts-detalle') + '&id=' + s.id" class="mono text-xs text-brand-600 dark:text-brand-400 hover:underline whitespace-nowrap" x-text="s.codigo"></a></td>
                <td class="max-w-[240px]"><p class="truncate" :title="s.nombre" x-text="s.nombre"></p></td>
                <td x-text="s.distrito"></td>
                <td class="mono text-xs whitespace-nowrap" x-text="UI.fmt.coord(s.lat) + ', ' + UI.fmt.coord(s.lng)"></td>
                <td class="text-xs" x-text="s.tipo"></td>
                <td class="mono text-xs" x-text="s.proyecto"></td>
                <td class="text-xs mono" x-text="s.tecnologias.join('/')"></td>
                <td x-html="UI.badge(s.estado)"></td>
                <td><span x-show="s.avance >= 0" x-html="UI.progress(Math.max(0,s.avance))"></span><span x-show="s.avance < 0" class="text-xs text-ink-3">—</span></td>
                <td class="row-actions text-right whitespace-nowrap">
                  <button class="ui-btn ui-btn-ghost ui-btn-sm" x-show="$store.ui.puede('crear')"
                    @click="editarSitio($store.db.sitios.find(x => x.id === s.id))" x-tooltip="'Editar sitio'" aria-label="Editar" x-html="UI.icon('edit',14)"></button>
                  <button class="ui-btn ui-btn-ghost ui-btn-sm" x-show="$store.ui.puede('crear')"
                    @click="borrando = s" x-tooltip="'Eliminar sitio'" aria-label="Eliminar" x-html="UI.icon('trash',14)"></button>
                </td>
              </tr>
            </template>
            <tr x-show="!filtered.length"><td colspan="10" x-html="UI.emptyState({icon:'search', title:'Sin resultados', desc:'Ningún sitio coincide con los filtros.'})"></td></tr>
          </tbody>
        </table>
      </div>
      <div class="flex items-center justify-between mt-2 text-xs">
        <span class="mono text-ink-2" x-text="rangeLabel"></span>
        <div class="flex gap-1">
          <button class="ui-btn ui-btn-ghost ui-btn-sm" :disabled="page<=1" @click="page--" aria-label="Anterior" x-html="UI.icon('chevronLeft',14)"></button>
          <span class="mono self-center px-1 text-ink-2" x-text="`${page} / ${totalPages}`"></span>
          <button class="ui-btn ui-btn-ghost ui-btn-sm" :disabled="page>=totalPages" @click="page++" aria-label="Siguiente" x-html="UI.icon('chevronRight',14)"></button>
        </div>
      </div>
    </section>
  </div>

  <!-- ══ Modal: alta / edición de sitio ══ -->
  <template x-if="form">
    <div @keydown.escape.window="form=null">
      <div class="ui-backdrop" @click="form=null" x-transition:enter="fade-enter" x-transition:enter-start="fade-enter-start"></div>
      <div class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="st-t">
        <div class="ui-modal-box" style="max-width:620px" x-transition:enter="pop-enter" x-transition:enter-start="pop-enter-start">
          <div class="ui-modal-head">
            <h3 class="font-semibold" id="st-t" x-text="form.id ? 'Editar estación base' : 'Registrar estación base'"></h3>
            <button class="ui-btn ui-btn-ghost ui-btn-sm" @click="form=null" aria-label="Cerrar" x-html="UI.icon('x',15)"></button>
          </div>
          <div class="ui-modal-body space-y-4">
            <div class="grid sm:grid-cols-2 gap-3">
              <div>
                <label class="ui-label" for="st-cod">Código de sitio *</label>
                <input id="st-cod" class="ui-input mono" :class="errCodigo && 'is-invalid'" x-model="form.codigo"
                  placeholder="IC-PISCO-0342" @input="tocado=true; form.codigo = form.codigo.toUpperCase()" autofocus>
                <p class="ui-error" x-show="errCodigo" x-cloak><span x-html="UI.icon('alertCircle',12)"></span><span x-text="errCodigo"></span></p>
                <p class="ui-help" x-show="!errCodigo">Formato de operador: REGIÓN-DISTRITO-NNNN</p>
              </div>
              <div>
                <label class="ui-label" for="st-nom">Nombre del sitio *</label>
                <input id="st-nom" class="ui-input" :class="errNombre && 'is-invalid'" x-model="form.nombre"
                  placeholder="Ej. Azotea Galería Fénix" @input="tocado=true">
                <p class="ui-error" x-show="errNombre" x-cloak><span x-html="UI.icon('alertCircle',12)"></span><span x-text="errNombre"></span></p>
              </div>
              <div class="sm:col-span-2">
                <label class="ui-label" for="st-dir">Dirección</label>
                <input id="st-dir" class="ui-input" x-model="form.direccion" placeholder="Ej. Panamericana Sur km 296, Subtanjalla">
              </div>
              <div>
                <label class="ui-label" for="st-dis">Distrito</label>
                <input id="st-dis" class="ui-input" x-model="form.distrito" placeholder="Ej. Subtanjalla">
              </div>
              <div>
                <label class="ui-label" for="st-pro">Provincia</label>
                <input id="st-pro" class="ui-input" x-model="form.provincia" list="provincias" placeholder="Ej. Ica">
                <datalist id="provincias"><option>Ica</option><option>Pisco</option><option>Chincha</option><option>Nazca</option><option>Palpa</option></datalist>
              </div>

              <div>
                <label class="ui-label" for="st-lat">Latitud *</label>
                <input id="st-lat" class="ui-input mono" :class="errCoords && 'is-invalid'" x-model="form.lat"
                  placeholder="-14.06414" inputmode="decimal" @input="tocado=true" @paste="pegarCoords($event)">
              </div>
              <div>
                <label class="ui-label" for="st-lng">Longitud *</label>
                <input id="st-lng" class="ui-input mono" :class="errCoords && 'is-invalid'" x-model="form.lng"
                  placeholder="-75.72951" inputmode="decimal" @input="tocado=true" @paste="pegarCoords($event)">
              </div>
              <div class="sm:col-span-2 -mt-2">
                <p class="ui-error" x-show="errCoords" x-cloak><span x-html="UI.icon('alertCircle',12)"></span><span x-text="errCoords"></span></p>
                <p class="ui-help" x-show="!errCoords">Puedes pegar «-13.71030, -76.20320» copiado de Google Maps en cualquiera de los dos campos.</p>
              </div>

              <div>
                <label class="ui-label" for="st-tipo">Tipo de estructura</label>
                <select id="st-tipo" class="ui-select" x-model="form.tipo">
                  <template x-for="t in TIPOS_SITIO" :key="t"><option :value="t" x-text="t"></option></template>
                </select>
              </div>
              <div>
                <label class="ui-label" for="st-alt">Altura (m)</label>
                <input id="st-alt" type="number" min="0" max="120" class="ui-input mono" x-model.number="form.altura">
              </div>
              <div>
                <label class="ui-label" for="st-pry">Proyecto</label>
                <select id="st-pry" class="ui-select" x-model="form.proyectoId">
                  <option value="">Sin asignar</option>
                  <template x-for="p in $store.db.proyectos" :key="p.id"><option :value="p.id" x-text="p.codigo + ' — ' + p.nombre"></option></template>
                </select>
              </div>
              <div>
                <label class="ui-label" for="st-est">Estado</label>
                <select id="st-est" class="ui-select" x-model="form.estado">
                  <option value="planificado">Planificado</option><option value="en_ejecucion">En ejecución</option>
                  <option value="operativo">Operativo</option><option value="alarma">En alarma</option>
                  <option value="inactivo">Inactivo</option>
                </select>
              </div>
              <div class="sm:col-span-2">
                <label class="ui-label" for="st-ene">Energía</label>
                <input id="st-ene" class="ui-input" x-model="form.energia" list="energias"
                  placeholder="Ej. Red comercial + banco 48V">
                <datalist id="energias">
                  <option>Red comercial</option><option>Red comercial + banco 48V</option>
                  <option>Red comercial + grupo electrógeno</option><option>Solar + banco 48V</option>
                </datalist>
              </div>
              <div class="sm:col-span-2">
                <p class="ui-label">Tecnologías desplegadas</p>
                <div class="flex gap-2 flex-wrap">
                  <template x-for="t in TECNOLOGIAS" :key="t">
                    <label class="flex items-center gap-2 border border-line rounded-md px-3 py-1.5 cursor-pointer hover:bg-surface-2 tr-150"
                      :class="form.tecnologias.includes(t) && 'ring-2 ring-brand-500'">
                      <input type="checkbox" class="ui-check" :value="t" x-model="form.tecnologias">
                      <span class="mono text-sm" x-text="t"></span>
                    </label>
                  </template>
                </div>
              </div>
            </div>
          </div>
          <div class="ui-modal-foot">
            <button class="ui-btn ui-btn-secondary ui-btn-md" @click="form=null">Cancelar</button>
            <button class="ui-btn ui-btn-primary ui-btn-md" :data-loading="guardando ? 1 : 0" @click="guardarSitio()">
              <span class="spin" aria-hidden="true"></span>
              <span x-text="form.id ? 'Guardar cambios' : 'Registrar sitio'"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ══ Confirmación de eliminación ══ -->
  <template x-if="borrando">
    <div @keydown.escape.window="borrando=null">
      <div class="ui-backdrop" @click="borrando=null" x-transition:enter="fade-enter" x-transition:enter-start="fade-enter-start"></div>
      <div class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="del-t">
        <div class="ui-modal-box" style="max-width:440px" x-transition:enter="pop-enter" x-transition:enter-start="pop-enter-start">
          <div class="ui-modal-head">
            <h3 class="font-semibold" id="del-t">Eliminar estación base</h3>
            <button class="ui-btn ui-btn-ghost ui-btn-sm" @click="borrando=null" aria-label="Cerrar" x-html="UI.icon('x',15)"></button>
          </div>
          <div class="ui-modal-body space-y-3">
            <p class="text-sm">Vas a eliminar <span class="mono font-semibold" x-text="borrando.codigo"></span>
              — <span x-text="borrando.nombre"></span>.</p>
            <div class="p-3 rounded-md border text-sm" style="background:var(--st-pendiente-bg);border-color:var(--st-pendiente-bd)">
              <p class="text-ink-2">Si el sitio tiene actividades registradas no podrá eliminarse, para no perder el
                historial de trabajos. En ese caso cámbialo a estado <span class="font-medium text-ink-1">inactivo</span>.</p>
            </div>
          </div>
          <div class="ui-modal-foot">
            <button class="ui-btn ui-btn-secondary ui-btn-md" @click="borrando=null">Cancelar</button>
            <button class="ui-btn ui-btn-danger ui-btn-md" @click="confirmarBorrado()">Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </template>
</main>

</body>
</html>
