<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · NettOps Perú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tailwind.css">
<script src="js/tokens.js"></script>
<script src="js/components.js"></script>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/core/calc.js"></script>
<script src="js/api.js"></script>
<script>
function loginPage() {
  return {
    email: '', clave: '', rol: 'admin',
    cargando: false, listo: false, demo: true,
    touched: { u: false, c: false },
    errorServidor: '',

    async init() {
      const estado = await API.iniciar();
      this.demo = estado.modoDemo;
      this.listo = true;
      // Sesión ya activa: entra directo
      if (!this.demo && API.sesionActiva()) this.entrar_al_sistema();
    },

    get errU() {
      if (!this.touched.u) return '';
      if (!this.email.trim()) return this.demo ? 'Ingresa tu usuario' : 'Ingresa tu correo corporativo';
      if (!this.demo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(this.email.trim())) return 'Formato de correo inválido';
      return '';
    },
    get errC() {
      if (!this.touched.c) return '';
      return this.clave.length < 6 ? 'La contraseña debe tener al menos 6 caracteres' : '';
    },

    destino() {
      const next = new URLSearchParams(location.search).get('next');
      const rol = this.demo ? this.rol : (API.miPerfil()?.rol || 'tecnico');
      const pagina = next || (rol === 'tecnico' ? 'mi-jornada' : rol === 'supervisor' ? 'supervision' : 'dashboard');
      return `app.html?role=${rol}#/${pagina}`;
    },
    entrar_al_sistema() { location.href = this.destino(); },

    async ingresar() {
      this.touched = { u: true, c: true };
      this.errorServidor = '';
      if (this.errU || this.errC || !this.email.trim() || this.clave.length < 6) return;

      this.cargando = true;
      if (this.demo) {
        // Sin backend: acceso simulado como antes
        setTimeout(() => this.entrar_al_sistema(), 500);
        return;
      }
      const r = await API.entrar(this.email.trim(), this.clave);
      this.cargando = false;
      if (!r.ok) { this.errorServidor = r.error; return; }
      this.entrar_al_sistema();
    },
  };
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body data-layout="bare" class="bg-surface-0 min-h-screen flex flex-col" x-data="loginPage()">

<main class="flex-1 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-3 mb-6">
      <span class="text-brand-600 dark:text-brand-400" x-html="UI.icon('tower', 34)"></span>
      <div>
        <p class="text-xl font-bold tracking-tight leading-none">NettOps</p>
        <p class="text-xs text-ink-3 mono mt-1">Gestión de operaciones BTS · Perú</p>
      </div>
    </div>

    <form class="ui-card p-6 space-y-4 shadow-e2" @submit.prevent="ingresar()">
      <div>
        <label class="ui-label" for="lg-user" x-text="demo ? 'Usuario' : 'Correo corporativo'"></label>
        <input id="lg-user" :type="demo ? 'text' : 'email'" class="ui-input" :class="errU && 'is-invalid'"
          :placeholder="demo ? 'nombre.apellido' : 'nombre@nettops.pe'"
          x-model="email" @blur="touched.u=true" autocomplete="username" :aria-invalid="!!errU">
        <p class="ui-error" x-show="errU" x-cloak><span x-html="UI.icon('alertCircle',12)"></span><span x-text="errU"></span></p>
      </div>

      <div>
        <label class="ui-label" for="lg-pass">Contraseña</label>
        <input id="lg-pass" type="password" class="ui-input" :class="errC && 'is-invalid'" placeholder="••••••••"
          x-model="clave" @blur="touched.c=true" autocomplete="current-password" :aria-invalid="!!errC">
        <p class="ui-error" x-show="errC" x-cloak><span x-html="UI.icon('alertCircle',12)"></span><span x-text="errC"></span></p>
      </div>

      <!-- El rol solo se elige sin backend; con cuentas reales lo define el perfil -->
      <div x-show="demo" x-cloak>
        <label class="ui-label" for="lg-rol">Ingresar como</label>
        <select id="lg-rol" class="ui-select" x-model="rol">
          <option value="admin">Administrador</option>
          <option value="supervisor">Supervisor</option>
          <option value="tecnico">Técnico de campo</option>
        </select>
        <p class="ui-help">El rol determina los módulos y acciones disponibles.</p>
      </div>

      <!-- Error del servidor -->
      <div x-show="errorServidor" x-cloak class="p-3 rounded-md border text-sm flex gap-2.5 items-start" role="alert"
        style="background:var(--st-critico-bg);border-color:var(--st-critico-bd)">
        <span style="color:var(--st-critico)" x-html="UI.icon('alertCircle',16)"></span>
        <p class="text-ink-2" x-text="errorServidor"></p>
      </div>

      <button type="submit" class="ui-btn ui-btn-primary ui-btn-lg w-full" :data-loading="cargando ? 1 : 0" :disabled="!listo">
        <span class="spin" aria-hidden="true"></span>
        <span x-text="cargando ? 'Verificando…' : 'Ingresar'"></span>
      </button>

      <p class="text-xs text-ink-3 text-center" x-show="listo && demo" x-cloak>
        Modo demo — sin servidor conectado. Cualquier usuario y una contraseña de 6+ caracteres funcionan.
      </p>
      <p class="text-xs text-ink-3 text-center flex items-center justify-center gap-1.5" x-show="listo && !demo" x-cloak>
        <span style="color:var(--st-completado)" x-html="UI.icon('shield',12)"></span>
        Conectado · sesión cifrada
      </p>
    </form>

    <div class="flex items-center justify-center gap-4 mt-5 text-xs text-ink-3">
      <a href="pages/design-system.html" class="hover:text-ink-1 tr-150 flex items-center gap-1.5" x-html="UI.icon('grid',12) + ' Sistema de diseño'"></a>
      <span aria-hidden="true">·</span>
      <span class="mono">NettOps v1.0</span>
    </div>
  </div>
</main>

</body>
</html>
